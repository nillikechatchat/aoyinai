baseURL = 'https://example.com/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh-cn'
title = '鸿渐于陆 · 易经智慧'
theme = 'PaperMod'

# 多语言支持（简化为单中文站点，结构上预留多语言）
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

# Pagination
paginate = 9
paginatePath = 'page'

# Enable Feeds
enableRobotsTXT = true

[params]
  env = 'production'
  description = '易经渐卦智慧 - 鸿雁渐进，修身齐家，感悟东方哲学之美'
  keywords = ['易经', '渐卦', '鸿渐', '国学', '传统文化', '哲学']
  author = '易经传承者'
  DateFormat = '2006-01-02'
  defaultTheme = 'dark'
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  disableSpecial1stPost = true
  disableScrollToTop = false
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # 自定义 Logo / 标题区
  label.text = '鸿渐 · 易经'
  label.icon = '/favicon.svg'
  label.iconHeight = 35

  # 社交账号
  [[params.socialIcons]]
    name = 'github'
    title = 'GitHub'
    url = 'https://github.com/'

# 菜单（栏目导航）
[[menu.main]]
  identifier = 'home'
  name = '首页'
  url = '/'
  weight = 1

[[menu.main]]
  identifier = 'gradual'
  name = '渐进之道'
  url = '/categories/gradual/'
  weight = 2

[[menu.main]]
  identifier = 'wisdom'
  name = '卦辞解读'
  url = '/categories/wisdom/'
  weight = 3

[[menu.main]]
  identifier = 'practice'
  name = '修身实践'
  url = '/categories/practice/'
  weight = 4

[[menu.main]]
  identifier = 'culture'
  name = '文化传承'
  url = '/categories/culture/'
  weight = 5

[[menu.main]]
  identifier = 'about'
  name = '关于'
  url = '/about/'
  weight = 6

# 输出 markdown 处理
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    style = 'monokai'
    tabWidth = 2

# 输出
[outputs]
  home = ['HTML', 'RSS', 'JSON']
  section = ['HTML', 'RSS']
  taxonomy = ['HTML', 'RSS']
